<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Quieres ser mi San Valentín?</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Arial', sans-serif;
}

html, body{
    height:100%;
    overflow:hidden;
    background: #ffe6e6;
}

/* ===== SLIDER DE FONDO ===== */
.background-slider{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    z-index:0;
}

.background-slider img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit: cover;
    opacity:0;
    transition:opacity 1.5s ease-in-out;
}

.background-slider img.active{
    opacity:1;
}

/* ===== OVERLAY ROMÁNTICO ===== */
.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background: linear-gradient(
        rgba(255,182,193,0.3),
        rgba(255,192,203,0.2),
        rgba(255,182,193,0.3)
    );
    z-index:1;
}

/* ===== CONTENIDO ABAJO ===== */
.container{
    position:absolute;
    bottom:50px;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    z-index:4;
    padding:0 20px;
}

h1{
    font-size:1.8rem;
    font-weight:600;
    color:#ff4d6d;
    margin-bottom:20px;
    animation:fadeIn 2s ease-in-out;
    line-height:1.3;
}

.buttons{
    display:flex;
    gap:15px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:25px;
    font-size:1.1rem;
    cursor:pointer;
    transition:0.3s;
    font-weight:bold;
}

#yesBtn{
    background:#ff4d6d;
    color:white;
}

#yesBtn:hover{
    background:#ff1e4d;
    transform:scale(1.1);
}

#noBtn{
    background:white;
    color:#ff4d6d;
    transition: left 0.3s ease, top 0.3s ease;
    cursor:pointer;
}

/* ===== EMOJIS FLOTANDO ===== */
.floatingEmoji{
    position:absolute;
    font-size:24px;
    animation:floatUp 3s linear forwards;
    z-index:3;
    bottom:0;
}

/* Animación emojis */
@keyframes floatUp{
    0%{
        transform:translateY(0) scale(1);
        opacity:1;
    }
    100%{
        transform:translateY(-400px) scale(1.3);
        opacity:0;
    }
}

/* Animación texto */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(-20px);}
    to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<!-- SLIDER -->
<div class="background-slider">
    <img src="foto1.jpg" class="active">
    <img src="foto2.jpg">
    <img src="foto3.jpg">
    <img src="foto4.jpg">
    <img src="foto6.jpg">
    <img src="foto7.jpg">
</div>

<div class="overlay"></div>

<div class="container">
    <h1>💖 Yessica...
        ¿Quieres ser mi San Valentín? 💖</h1>

    <div class="buttons">
        <button id="yesBtn" onclick="alert('¡Sabía que dirías que sí ❤️!')">Sí 💘</button>
        <button id="noBtn">No 😢</button>
    </div>
</div>

<!-- Música -->
<audio autoplay loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>
/* ===== SLIDER AUTOMÁTICO ===== */
let slides = document.querySelectorAll(".background-slider img");
let index = 0;

setInterval(()=>{
    slides[index].classList.remove("active");
    index = (index + 1) % slides.length;
    slides[index].classList.add("active");
}, 4000);

/* ===== EMOJIS AL HACER CLICK EN NO ===== */
const noBtn = document.getElementById("noBtn");
const emojis = ["😂","😢","🤣","😭","😹","😿"]; // emojis de risa y tristeza

noBtn.addEventListener("click", () => {
    const emoji = document.createElement('div');
    emoji.classList.add('floatingEmoji');
    
    // Elegir emoji aleatorio
    emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    
    // Posición horizontal aleatoria
    emoji.style.left = Math.random() * window.innerWidth + "px";
    
    // Tamaño aleatorio
    emoji.style.fontSize = (20 + Math.random() * 20) + "px";
    
    document.body.appendChild(emoji);
    
    // Eliminar después de animación
    setTimeout(()=> emoji.remove(), 3000);
});
</script>

</body>
</html>
