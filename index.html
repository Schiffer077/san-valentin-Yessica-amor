<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decisión Final</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

html, body{
    height:100%;
    overflow:hidden;
    background:black;
    color:white;
}

/* FONDO */
.background-slider{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    z-index:0;
}

.background-slider img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transition:opacity 1.5s ease-in-out;
}

.background-slider img.active{
    opacity:1;
}

.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.4);
    z-index:1;
}

/* CONTENEDOR */
.container{
    position:absolute;
    bottom:60px;
    width:100%;
    text-align:center;
    z-index:3;
    padding:20px;
}

h1{
    font-size:1.4rem;
    margin-bottom:20px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:25px;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
    margin:5px;
}

#yesBtn{
    background:#ff4d6d;
    color:white;
}

#noBtn{
    background:white;
    color:#ff4d6d;
}

/* CONTADOR */
#contadorContainer{
    position: fixed;
    bottom: 5px;
    width: 100%;
    text-align: center;
    font-weight: bold;
    font-size: 0.7rem;
    z-index: 4;
}

/* ANIMACIÓN DESAPARECER */
.fadeOut{
    animation:fadeOut 2s forwards;
}

@keyframes fadeOut{
    from{opacity:1;}
    to{opacity:0;}
}
</style>
</head>

<body>

<div class="background-slider">
    <img src="foto1.jpg" class="active">
    <img src="foto2.jpg">
    <img src="foto6.jpg">
    <img src="foto7.jpg">
    <img src="foto9.jpg">
</div>

<div class="overlay"></div>

<div class="container" id="mainContainer"></div>

<div id="contadorContainer"></div>

<audio autoplay loop>
<source src="musica.mp3" type="audio/mpeg">
</audio>

<script>

/* ==============================
INICIO – VERIFICAR DECISIÓN
================================*/

if(localStorage.getItem("decisionFinal")){
    mostrarResultado(localStorage.getItem("decisionFinal"));
} else {
    mostrarInstructivo();
}

/* ==============================
INSTRUCTIVO
================================*/

function mostrarInstructivo(){
    document.getElementById("mainContainer").innerHTML = `
    <h1>
    Antes de continuar…<br><br>
    Esta decisión es definitiva.<br>
    Solo podrás elegir una vez.<br><br>
    No podrás regresar.<br>
    No podrás cambiar tu respuesta.<br><br>
    Si continúas, aceptarás tu decisión.
    </h1>
    <button onclick="mostrarPregunta()">Aceptar y continuar</button>
    `;
}

/* ==============================
PREGUNTA
================================*/

function mostrarPregunta(){
    document.getElementById("mainContainer").innerHTML = `
    <h1>
    💘 Amorchis… 💘<br><br>
    ¿Quieres seguir construyendo nuestra historia conmigo?
    </h1>
    <button id="yesBtn">Sí 💘</button>
    <button id="noBtn">No 😢</button>
    `;

    document.getElementById("yesBtn").addEventListener("click", ()=>guardarDecision("si"));
    document.getElementById("noBtn").addEventListener("click", ()=>guardarDecision("no"));
}

/* ==============================
GUARDAR DECISIÓN
================================*/

function guardarDecision(valor){
    localStorage.setItem("decisionFinal", valor);
    mostrarResultado(valor);
}

/* ==============================
RESULTADOS
================================*/

function mostrarResultado(valor){

    if(valor === "si"){

        document.getElementById("mainContainer").innerHTML = `
        <h1>
        Gracias por elegirme otra vez ❤️<br><br>
        Sé que he fallado.<br>
        Sé que he estado distante.<br><br>
        Pero nunca he dejado de amarte.<br><br>
        No quiero prometer palabras.<br>
        Quiero demostrarte con hechos.<br><br>
        Eres mi persona favorita.
        </h1>
        `;

    } else {

        document.getElementById("mainContainer").innerHTML = `
        <h1>
        Entiendo tu decisión…<br><br>
        Gracias por todo lo que vivimos.<br>
        Me hiciste mejor hombre.<br><br>
        Siempre voy a agradecer haberte amado.
        </h1>
        <div id="countdown" style="margin-top:20px;font-size:20px;"></div>
        `;

        document.querySelector(".background-slider").classList.add("fadeOut");
        document.querySelector(".overlay").classList.add("fadeOut");

        iniciarCuentaRegresiva();
    }
}

/* ==============================
CUENTA REGRESIVA
================================*/

function iniciarCuentaRegresiva(){
    let tiempo = 15;
    const countdown = document.getElementById("countdown");

    const intervalo = setInterval(()=>{
        countdown.textContent = "Este enlace desaparecerá en " + tiempo + " segundos...";
        tiempo--;

        if(tiempo < 0){
            clearInterval(intervalo);
            document.body.innerHTML = "<h1 style='text-align:center;margin-top:40vh;'>El capítulo terminó.</h1>";
        }
    },1000);
}

/* ==============================
SLIDER
================================*/

let slides = document.querySelectorAll(".background-slider img");
let index = 0;

setInterval(()=>{
    slides[index].classList.remove("active");
    index = (index + 1) % slides.length;
    slides[index].classList.add("active");
},4000);

/* ==============================
CONTADOR
================================*/

const inicio = new Date("2024-12-21T00:00:00");
const contadorContainer = document.getElementById("contadorContainer");

    const dias = Math.floor(diff / (24*3600));
    diff %= 24*3600;
    const horas = Math.floor(diff/3600);
    diff %= 3600;
    const minutos = Math.floor(diff/60);
    const segundos = diff%60;

    contadorContainer.textContent =
    `⏳ ${dias} días, ${horas} horas, ${minutos} minutos y ${segundos} segundos contigo ⏳`;
}

setInterval(actualizarContador,1000);
actualizarContador();

/* ==============================
BLOQUEAR RECARGA
================================*/

window.onbeforeunload = function(){
    return "Esta decisión no puede cambiarse.";
};

/* ==============================
MODO SECRETO
================================*/

let tapCount = 0;
document.addEventListener("click", ()=>{
    tapCount++;
    if(tapCount >= 5){
        localStorage.removeItem("decisionFinal");
        alert("Modo desarrollador activado 😎 Reiniciando...");
        location.reload();
    }
    setTimeout(()=>{ tapCount=0; },2000);
});

</script>

</body>
</html>
