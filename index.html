<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti Yessica</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Arial', sans-serif;
}

html, body{
    height:100%;
    overflow:hidden;
    background: #ffe6e6;
}

/* SLIDER DE FONDO */
.background-slider{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    z-index:0;
}

.background-slider img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit: cover;
    opacity:0;
    transition:opacity 1.5s ease-in-out;
}

.background-slider img.active{
    opacity:1;
}

/* OVERLAY ROMÁNTICO */
.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background: linear-gradient(
        rgba(255,182,193,0.3),
        rgba(255,192,203,0.2),
        rgba(255,182,193,0.3)
    );
    z-index:1;
}

/* CONTENIDO ABAJO */
.container{
    position:absolute;
    bottom:50px;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    z-index:4;
    padding:0 20px;
}

h1{
    font-size:1.5rem;
    font-weight:600;
    color:#ff4d6d;
    margin-bottom:20px;
    animation:fadeIn 2s ease-in-out;
    line-height:1.3;
}

.buttons{
    display:flex;
    gap:15px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:25px;
    font-size:1.1rem;
    cursor:pointer;
    transition:0.3s;
    font-weight:bold;
}

#yesBtn{
    background:#ff4d6d;
    color:white;
}

#yesBtn:hover{
    background:#ff1e4d;
    transform:scale(1.1);
}

#noBtn{
    background:white;
    color:#ff4d6d;
    cursor:pointer;
}

/* CONTADOR DE VIDA DE AMOR */
#contadorContainer{
    position: fixed;       /* pegado al borde inferior */
    bottom: 5px;           /* cerca del borde */
    width: 100%;           /* ocupa todo el ancho */
    text-align: center;    /* centrado */
    color: #000000;        /* letra negra */
    font-weight: 900;       /* más gruesa */
    font-size: 0.7rem;     /* pequeño y discreto */
    z-index: 5;            /* encima de todo */
}

/* CORAZONES FLOTANDO */
.heart{
    position:absolute;
    width:20px;
    height:20px;
    background-color:#ff4d6d;
    transform:rotate(45deg);
    animation:floatUp 5s linear forwards;
    z-index:3;
    bottom:0;
}

.heart::before,
.heart::after{
    content:'';
    position:absolute;
    width:20px;
    height:20px;
    background-color:#ff4d6d;
    border-radius:50%;
    z-index:3;
}

.heart::before{
    top:-10px;
    left:0;
}

.heart::after{
    top:0;
    left:-10px;
}

/* EMOJIS FLOTANDO */
.floatingEmoji{
    position:absolute;
    font-size:24px;
    animation:floatUpEmoji 3s linear forwards;
    z-index:5;
    bottom:0;
}

/* Animaciones */
@keyframes floatUp{
    0%{
        transform:translateY(0) rotate(45deg); /* Corazon ghirados */
        opacity:1;
    }
    100%{
        transform:translateY(-600px) rotate(45deg);
        opacity:0;
    }
}

@keyframes floatUpEmoji{
    0%{
        transform:translateY(0) scale(1);
        opacity:1;
    }
    100%{
        transform:translateY(-400px) scale(1.3);
        opacity:0;
    }
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(-20px);}
    to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<!-- SLIDER -->
<div class="background-slider">
    <img src="foto1.jpg" class="active">
    <img src="foto2.jpg">
    <img src="foto6.jpg">
    <img src="foto7.jpg">
    <img src="foto9.jpg">
</div>

<div class="overlay"></div>

<div class="container">
    <h1>💘Amorchis💘...
        ¿Quieres ser mi San Valentín, este y los que restan de nuestra vida? 💖</h1>

    <div class="buttons">
        <button id="yesBtn" onclick="alert('¡Sí! ❤️‍🔥 Gracias por hacer que mi corazón estalle de felicidad. Recuerda que donde tú vayas, yo iré... si tú saltas, yo salto ❤️')">Sí 💘</button>
        <button id="noBtn">No 😢</button>
    </div>

    <!-- Contador de vida de amor -->
    <div id="contadorContainer"></div>
</div>

<!-- Música -->
<audio autoplay loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>

// ============================
// ESTADO ÚNICO
// ============================

if(localStorage.getItem("decisionFinal")){
    mostrarResultado(localStorage.getItem("decisionFinal"));
}

// ============================
// BOTONES
// ============================

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");

yesBtn.addEventListener("click", ()=>{
    guardarDecision("si");
});

noBtn.addEventListener("click", ()=>{
    guardarDecision("no");
});

function guardarDecision(valor){
    localStorage.setItem("decisionFinal", valor);
    mostrarResultado(valor);
}

// ============================
// MOSTRAR RESULTADO
// ============================

function mostrarResultado(valor){

    document.querySelector(".container").innerHTML = "";

    if(valor === "si"){

        document.querySelector(".container").innerHTML = `
        <h1 style="color:white;">
        Gracias por seguir eligiéndome ❤️<br><br>
        Sé que he sido distante.<br>
        Sé que te he hecho sentir sola algunas veces.<br><br>
        No quiero perderte.<br>
        No quiero que sientas que ya no me importas.<br><br>
        Te amo. Y estoy dispuesto a demostrarlo con hechos.
        </h1>
        `;

    } else {

        document.querySelector(".container").innerHTML = `
        <h1 style="color:white;">
        Entiendo tu decisión.<br><br>
        Gracias por lo que vivimos.<br>
        Me hiciste mejor hombre.<br><br>
        Siempre voy a desearte lo mejor.
        </h1>
        <div id="countdown" style="font-size:30px; margin-top:20px;"></div>
        `;

        iniciarCuentaRegresiva();
    }
}

// ============================
// CUENTA REGRESIVA SI ES NO
// ============================

function iniciarCuentaRegresiva(){
    let tiempo = 15;
    const countdown = document.getElementById("countdown");

    const intervalo = setInterval(()=>{
        countdown.textContent = "Este enlace desaparecerá en " + tiempo + " segundos...";
        tiempo--;

        if(tiempo < 0){
            clearInterval(intervalo);
            document.body.innerHTML = "<h1 style='color:white; text-align:center; margin-top:40vh;'>El capítulo terminó.</h1>";
        }

    },1000);
}

// ============================
// SLIDER ORIGINAL
// ============================

let slides = document.querySelectorAll(".background-slider img");
let index = 0;
setInterval(()=>{
    slides[index].classList.remove("active");
    index = (index + 1) % slides.length;
    slides[index].classList.add("active");
}, 4000);

// ============================
// CONTADOR ORIGINAL
// ============================

    contadorContainer.textContent =

}

setInterval(actualizarContador, 1000);
actualizarContador();

// ============================
// BLOQUEAR RECARGA
// ============================

window.onbeforeunload = function(){
    return "Esta decisión no puede cambiarse.";
};
    
// ============================
// MODO SECRETO (RESET)
// ============================

let tapCount = 0;
const titulo = document.querySelector("h1");

titulo.addEventListener("click", () => {
    tapCount++;

    if(tapCount >= 5){
        localStorage.removeItem("decisionFinal");
        alert("Modo desarrollador activado 😎 Reiniciando...");
        location.reload();
    }

    setTimeout(() => {
        tapCount = 0;
    }, 2000);
});
    
</script>

</body>
</html>
