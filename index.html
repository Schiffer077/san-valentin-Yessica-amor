<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti Yessica</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Arial', sans-serif;
}

html, body{
    height:100%;
    overflow:hidden;
    background: #ffe6e6;
}

/* SLIDER DE FONDO */
.background-slider{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    z-index:0;
}

.background-slider img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit: cover;
    opacity:0;
    transition:opacity 1.5s ease-in-out;
}

.background-slider img.active{
    opacity:1;
}

/* OVERLAY ROMÁNTICO */
.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background: linear-gradient(
        rgba(255,182,193,0.3),
        rgba(255,192,203,0.2),
        rgba(255,182,193,0.3)
    );
    z-index:1;
}

/* CONTENIDO ABAJO */
.container{
    position:absolute;
    bottom:50px;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    z-index:4;
    padding:0 20px;
}

h1{
    font-size:1.5rem;
    font-weight:600;
    color:#ff4d6d;
    margin-bottom:20px;
    animation:fadeIn 2s ease-in-out;
    line-height:1.3;
}

.buttons{
    display:flex;
    gap:15px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:25px;
    font-size:1.1rem;
    cursor:pointer;
    transition:0.3s;
    font-weight:bold;
}

#yesBtn{
    background:#ff4d6d;
    color:white;
}

#yesBtn:hover{
    background:#ff1e4d;
    transform:scale(1.1);
}

#noBtn{
    background:white;
    color:#ff4d6d;
    cursor:pointer;
}

/* CONTADOR DE VIDA DE AMOR */
#contadorContainer{
    position: fixed;       /* pegado al borde inferior */
    bottom: 5px;           /* cerca del borde */
    width: 100%;           /* ocupa todo el ancho */
    text-align: center;    /* centrado */
    color: #000000;        /* letra negra */
    font-weight: 900;       /* más gruesa */
    font-size: 0.7rem;     /* pequeño y discreto */
    z-index: 5;            /* encima de todo */
}

/* CORAZONES FLOTANDO */
.heart{
    position:absolute;
    width:20px;
    height:20px;
    background-color:#ff4d6d;
    transform:rotate(45deg);
    animation:floatUp 5s linear forwards;
    z-index:3;
    bottom:0;
}

.heart::before,
.heart::after{
    content:'';
    position:absolute;
    width:20px;
    height:20px;
    background-color:#ff4d6d;
    border-radius:50%;
    z-index:3;
}

.heart::before{
    top:-10px;
    left:0;
}

.heart::after{
    top:0;
    left:-10px;
}

/* EMOJIS FLOTANDO */
.floatingEmoji{
    position:absolute;
    font-size:24px;
    animation:floatUpEmoji 3s linear forwards;
    z-index:5;
    bottom:0;
}

/* Animaciones */
@keyframes floatUp{
    0%{
        transform:translateY(0) rotate(45deg); /* Corazon ghirados */
        opacity:1;
    }
    100%{
        transform:translateY(-600px) rotate(45deg);
        opacity:0;
    }
}

@keyframes floatUpEmoji{
    0%{
        transform:translateY(0) scale(1);
        opacity:1;
    }
    100%{
        transform:translateY(-400px) scale(1.3);
        opacity:0;
    }
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(-20px);}
    to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<!-- SLIDER -->
<div class="background-slider">
    <img src="foto10.jpg" class="active">
</div>

<div class="overlay"></div>

<div class="container">
    <h1> Mi niña tonta...
        ¿Me perdonas, por hacerte enojar en la mañana? 💖</h1>

    <div class="buttons">
        <button id="yesBtn" onclick="alert('Pensare por el bien de ambos lo prometo, gracias por decir !SI!, esta vez pondre a pensarme en nuestro futuro, en todo lo bueno y malo que hemos echo y ambos, se que tengo muchos errores y tal ves de esos debo aprender, no sabia ue estabas mal por nosotros o porque yo he sido distantes no lo concidero, pero creo tampo es bueno QUEDARTE CALLADA no solucionamos nada y no soy mago solo soy BATMAN❤️')">Sí 💘</button>
        <button id="noBtn">No 😢</button>
    </div>

    <!-- Contador de vida de amor -->
    <div id="contadorContainer"></div>
</div>

<!-- Música -->
<audio autoplay loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>
/* SLIDER AUTOMÁTICO */
let slides = document.querySelectorAll(".background-slider img");
let index = 0;
setInterval(()=>{
    slides[index].classList.remove("active");
    index = (index + 1) % slides.length;
    slides[index].classList.add("active");
}, 4000);

/* CORAZONES AUTOMÁTICOS */
setInterval(()=>{
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.style.left = Math.random() * window.innerWidth + "px";
    const size = 15 + Math.random() * 15;
    heart.style.width = size + "px";
    heart.style.height = size + "px";
    heart.style.animationDuration = (4 + Math.random() * 3) + "s";
    document.body.appendChild(heart);
    setTimeout(()=> heart.remove(), 7000);
}, 500);

/* EMOJIS AL DAR CLICK EN NO */
const noBtn = document.getElementById("noBtn");
const emojis = ["🖕","😤","☠️"];

noBtn.addEventListener("click", () => {
    for(let i=0; i<5; i++){
        const emoji = document.createElement('div');
        emoji.classList.add('floatingEmoji');
        emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        emoji.style.left = Math.random() * window.innerWidth + "px";
        emoji.style.fontSize = (20 + Math.random() * 20) + "px";
        document.body.appendChild(emoji);
        setTimeout(()=> emoji.remove(), 3000);
    }
});

/* CONTADOR DE VIDA DE AMOR */

// actualizar cada segundo

</script>

</body>
</html>
