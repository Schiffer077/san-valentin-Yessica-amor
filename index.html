<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti Yessica</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Arial', sans-serif;
}

html, body{
    height:100%;
    overflow:hidden;
    background: #ffe6e6;
}

/* SLIDER */
.background-slider{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    z-index:0;
}

.background-slider img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit: cover;
    opacity:0;
    transition:opacity 1.5s ease-in-out;
}

.background-slider img.active{
    opacity:1;
}

/* OVERLAY */
.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background: linear-gradient(
        rgba(255,182,193,0.3),
        rgba(255,192,203,0.2),
        rgba(255,182,193,0.3)
    );
    z-index:1;
}

/* CONTENIDO */
.container{
    position:absolute;
    bottom:50px;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    z-index:4;
    padding:0 20px;
}

h1{
    font-size:1.5rem;
    font-weight:600;
    color:#ff4d6d;
    margin-bottom:20px;
    line-height:1.3;
}

.buttons{
    display:flex;
    gap:15px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:25px;
    font-size:1.1rem;
    cursor:pointer;
    transition:0.3s;
    font-weight:bold;
}

#yesBtn{
    background:#ff4d6d;
    color:white;
}

#yesBtn:hover{
    background:#ff1e4d;
    transform:scale(1.1);
}

#noBtn{
    background:white;
    color:#ff4d6d;
}

#contadorContainer{
    position: fixed;
    bottom: 5px;
    width: 100%;
    text-align: center;
    color: #000;
    font-weight: 900;
    font-size: 0.7rem;
    z-index: 5;
}
</style>
</head>

<body>

<div class="background-slider">
    <!-- IMÁGENES INICIALES -->
    <img src="foto1.jpg" class="active">
    <img src="foto2.jpg">
    <img src="foto6.jpg">
</div>

<div class="overlay"></div>

<div class="container">
    <h1>
        💘Amorchis💘...<br>
        ¿Quieres seguir escribiendo esta historia conmigo? 💖
    </h1>

    <div class="buttons">
        <button id="yesBtn">Sí 💘</button>
        <button id="noBtn">No 😢</button>
    </div>

    <div id="contadorContainer"></div>
</div>

<audio autoplay loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>

// ============================
// SLIDER
// ============================

let slides = document.querySelectorAll(".background-slider img");
let index = 0;
let sliderInterval;

function iniciarSlider(){
    sliderInterval = setInterval(()=>{
        slides[index].classList.remove("active");
        index = (index + 1) % slides.length;
        slides[index].classList.add("active");
    }, 4000);
}

iniciarSlider();

function cambiarImagenes(lista){
    clearInterval(sliderInterval);

    const slider = document.querySelector(".background-slider");
    slider.innerHTML = "";

    lista.forEach((img, i)=>{
        const imagen = document.createElement("img");
        imagen.src = img;
        if(i === 0) imagen.classList.add("active");
        slider.appendChild(imagen);
    });

    slides = document.querySelectorAll(".background-slider img");
    index = 0;

    iniciarSlider();
}

// ============================
// DECISIÓN ÚNICA
// ============================

if(localStorage.getItem("decisionFinal")){
    mostrarResultado(localStorage.getItem("decisionFinal"));
}

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");

yesBtn.addEventListener("click", ()=>{
    guardarDecision("si");
});

noBtn.addEventListener("click", ()=>{
    guardarDecision("no");
});

function guardarDecision(valor){
    localStorage.setItem("decisionFinal", valor);
    mostrarResultado(valor);
}

function mostrarResultado(valor){

    document.querySelector(".container").innerHTML = "";

    if(valor === "si"){

        cambiarImagenes([
            "recuerdo1.jpg",
            "recuerdo2.jpg",
            "recuerdo3.jpg"
        ]);

        document.querySelector(".container").innerHTML = `
        <h1 style="color:white;">
        Gracias por seguir eligiéndome ❤️<br><br>
        No quiero perderte.<br>
        Te amo. Y voy a demostrarlo con hechos.
        </h1>
        `;

    } else {

        cambiarImagenes([
            "triste1.jpg",
            "triste2.jpg",
            "triste3.jpg",
            "triste4.jpg",
            "triste5.jpg",
            "triste6.jpg",
            "triste7.jpg"
        ]);

        document.querySelector(".container").innerHTML = `
        <h1 style="color:white;">
        Entiendo tu decisión.<br><br>
        Gracias por lo vivido.
        </h1>
        <div id="countdown" style="font-size:30px; margin-top:20px;"></div>
        `;

        iniciarCuentaRegresiva();
    }
}

// ============================
// CUENTA REGRESIVA
// ============================

function iniciarCuentaRegresiva(){
    let tiempo = 15;
    const countdown = document.getElementById("countdown");

    const intervalo = setInterval(()=>{
        countdown.textContent = "Este enlace desaparecerá en " + tiempo + " segundos...";
        tiempo--;

        if(tiempo < 0){
            clearInterval(intervalo);
            document.body.innerHTML =
            "<h1 style='color:white; text-align:center; margin-top:40vh;'>El capítulo terminó.</h1>";
        }

    },1000);
}

// ============================
// CONTADOR
// ============================

const contadorContainer = document.getElementById("contadorContainer");

    diff %= 24*3600;

    const minutos = Math.floor(diff / 60);
    const segundos = diff % 60;

    contadorContainer.textContent =
    `⏳ ${dias} días, ${horas} horas, ${minutos} minutos y ${segundos} segundos contigo ⏳`;
}

setInterval(actualizarContador, 1000);
actualizarContador();

// ============================
// RESET SECRETO
// ============================

let tapCount = 0;
document.addEventListener("click", ()=>{
    tapCount++;

    if(tapCount >= 7){
        localStorage.removeItem("decisionFinal");
        alert("Modo desarrollador activado 😎 Reiniciando...");
        location.reload();
    }

    setTimeout(()=>{
        tapCount = 0;
    },2000);
});

</script>

</body>
</html>
