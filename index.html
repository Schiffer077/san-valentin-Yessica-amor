<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Quieres ser mi San Valentín?</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Arial', sans-serif;
}

html, body{
    height:100%;
    overflow:hidden;
    background: #ffe6e6; /* rosa clarito */
}

/* ===== SLIDER DE FONDO ===== */
.background-slider{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    z-index:0;
}

.background-slider img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit: cover;
    opacity:0;
    transition:opacity 1.5s ease-in-out;
}

.background-slider img.active{
    opacity:1;
}

/* ===== OVERLAY ROMÁNTICO ===== */
.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background: linear-gradient(
        rgba(255,182,193,0.3),
        rgba(255,192,203,0.2),
        rgba(255,182,193,0.3)
    );
    z-index:1;
}

/* ===== CONTENIDO ABAJO ===== */
.container{
    position:absolute;
    bottom:50px;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    z-index:4;
    padding:0 20px;
}

h1{
    font-size:1.8rem;
    font-weight:600;
    color:#ff4d6d;
    margin-bottom:20px;
    animation:fadeIn 2s ease-in-out;
    line-height:1.3;
}

.buttons{
    display:flex;
    gap:15px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:25px;
    font-size:1.1rem;
    cursor:pointer;
    transition:0.3s;
    font-weight:bold;
}

#yesBtn{
    background:#ff4d6d;
    color:white;
}

#yesBtn:hover{
    background:#ff1e4d;
    transform:scale(1.1);
}

#noBtn{
    background:white;
    color:#ff4d6d;
}

#noBtn:hover{
    position:absolute;
}

/* ===== CORAZONES FLOTANDO ===== */
.heart{
    position:absolute;
    width:20px;
    height:20px;
    background-color:#ff4d6d;
    transform:rotate(45deg);
    animation:floatUp 5s linear forwards;
    z-index:3;
    bottom:0;
}

.heart::before,
.heart::after{
    content:'';
    position:absolute;
    width:20px;
    height:20px;
    background-color:#ff4d6d;
    border-radius:50%;
    z-index:3;
}

.heart::before{
    top:-10px;
    left:0;
}

.heart::after{
    top:0;
    left:-10px;
}

/* Animación corazones */
@keyframes floatUp{
    0%{
        transform:translateY(0) rotate(45deg);
        opacity:1;
    }
    100%{
        transform:translateY(-600px) rotate(45deg);
        opacity:0;
    }
}

/* Animación texto */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(-20px);}
    to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<!-- SLIDER -->
<div class="background-slider">
    <img src="foto1.jpg" class="active">
    <img src="foto2.jpg">
    <img src="foto3.jpg">
    <img src="foto4.jpg">
    <img src="foto6.jpg">
    <img src="foto7.jpg">
</div>

<div class="overlay"></div>

<div class="container">
    <h1>💖 Yessica...
        ¿Quieres ser mi San Valentín? 💖</h1>

    <div class="buttons">
        <button id="yesBtn" onclick="alert('¡Sabía que dirías que sí ❤️!')">Sí 💘</button>
        <button id="noBtn">No 😢</button>
    </div>
</div>

<!-- Música -->
<audio autoplay loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>
/* ===== SLIDER AUTOMÁTICO ===== */
let slides = document.querySelectorAll(".background-slider img");
let index = 0;

setInterval(()=>{
    slides[index].classList.remove("active");
    index = (index + 1) % slides.length;
    slides[index].classList.add("active");
}, 4000);

/* ===== BOTÓN QUE HUYE SUAVEMENTE ===== */
const noBtn = document.getElementById("noBtn");
let moving = false;

noBtn.addEventListener("mouseover", () => {
    if(moving) return;
    moving = true;

    const btnWidth = noBtn.offsetWidth;
    const btnHeight = noBtn.offsetHeight;
    const maxX = window.innerWidth - btnWidth;
    const maxY = window.innerHeight - btnHeight - 50; // evitar overlay de botones

    noBtn.style.left = Math.random() * maxX + "px";
    noBtn.style.top = Math.random() * maxY + "px";

    setTimeout(()=> moving = false, 200); // espera 0.2s antes de otro movimiento
});

/* ===== CORAZONES FLOTANDO ===== */
setInterval(()=>{
    const heart = document.createElement('div');
    heart.classList.add('heart');
    
    // posición horizontal aleatoria
    heart.style.left = Math.random() * window.innerWidth + "px";
    
    // tamaño aleatorio
    const size = 15 + Math.random() * 15;
    heart.style.width = size + "px";
    heart.style.height = size + "px";
    
    // duración animación aleatoria
    heart.style.animationDuration = (4 + Math.random() * 3) + "s";
    
    document.body.appendChild(heart);
    
    // eliminar después de animación
    setTimeout(()=>{
        heart.remove();
    }, 7000);
}, 500);
</script>

</body>
</html>
