<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti Yessica</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Arial', sans-serif;
}

html, body{
    height:100%;
    overflow:hidden;
    background:#000;
}

/* SLIDER */
.background-slider{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    z-index:0;
}

.background-slider img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transition:opacity 1.5s ease-in-out, filter 1s ease;
}

.background-slider img.active{
    opacity:1;
}

.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.3);
    z-index:1;
}

.container{
    position:absolute;
    bottom:30px; /* todos los botones más abajo */
    width:100%;
    text-align:center;
    z-index:3;
    padding:20px;
}

h1{
    color:white;
    margin-bottom:20px;
    font-size:1.4rem;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:25px;
    font-size:1rem;
    cursor:pointer;
    font-weight:bold;
    margin:5px;
}

#yesBtn{
    background:#ff4d6d;
    color:white;
}

#noBtn{
    background:white;
    color:#ff4d6d;
}

/* LLUVIA */
.rain{
    position:fixed;
    width:2px;
    height:20px;
    background:rgba(0,150,255,0.7);
    animation:rainFall 1s linear infinite;
    z-index:2;
}

/* ESTRELLAS */
.star{
    position:fixed;
    color:white;
    opacity:0.8;
    z-index:2;
    pointer-events:none;
    font-size:12px;
    animation:caerEstrella 3s linear infinite;
}

@keyframes rainFall{
    0%{transform:translateY(-100px);}
    100%{transform:translateY(100vh);}
}

@keyframes caerEstrella{
    0%{transform:translateY(-50px);}
    100%{transform:translateY(100vh);}
}

</style>
</head>

<body>

<div class="background-slider" id="slider"></div>
<div class="overlay"></div>
<div class="container" id="mainContainer"></div>

<audio autoplay loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>

// ================= IMÁGENES =================

// Pantalla 1 (instructivo)
const imagenesInicio = [
    "foto102.jpg"
];

// Pantalla 2 (pregunta)
const imagenesPregunta = [
    "foto202.jpg",
    "foto7.jpg",
    "foto2.jpg",
    "foto6.jpg",
    "foto2010.jpg",
    "foto208.jpg",
    "foto204.jpg",
    "foto201.jpg",
    "foto1.jpg"
];

// Si dice sí
const imagenesSi = [

    "foto203.jpg",
];

// Si dice no
const imagenesNo = [
    "triste1.jpg",
    "triste2.jpg",
    "triste3.jpg"
];

let slides = [];
let index = 0;
let sliderInterval;

// ================= FUNCIÓN CAMBIAR IMÁGENES =================
function cambiarImagenes(lista, blancoNegro=false, rosita=false){
    clearInterval(sliderInterval);
    const slider = document.getElementById("slider");
    slider.innerHTML = "";

    lista.forEach((img,i)=>{
        const imagen = document.createElement("img");
        imagen.src = img;

        if(blancoNegro){
            imagen.style.filter="grayscale(100%) brightness(70%)";
        } else if(rosita){
            // Rosa más suave y romántico
            imagen.style.filter="brightness(90%) sepia(15%) saturate(150%) hue-rotate(-10deg)";
        } else {
            imagen.style.filter="none";
        }

        if(i===0) imagen.classList.add("active");
        slider.appendChild(imagen);
    });

    slides = document.querySelectorAll(".background-slider img");
    index=0;

    sliderInterval=setInterval(()=>{
        slides[index].classList.remove("active");
        index=(index+1)%slides.length;
        slides[index].classList.add("active");
    },4000);
}

// ================= ELIMINAR ESTRELLITAS =================
function eliminarEstrellitas(){
    const stars = document.querySelectorAll(".star");
    stars.forEach(s => s.remove());
}

// ================= FLUJO =================

function pantallaInstructivo(){
    cambiarImagenes(imagenesInicio);

    document.getElementById("mainContainer").innerHTML=`
        <h1></h1>
        <button style="background:#ffb6c1; color:white;" onclick="pantallaPregunta()">
            Aceptar y continuar ❤️
        </button>
    `;
}

function pantallaPregunta(){
    cambiarImagenes(imagenesPregunta, false, true); // imágenes rositas suaves

    document.getElementById("mainContainer").innerHTML=`
        <h1>
        <br>
        ¿Quieres seguir escribiendo esta historia conmigo?
        </h1>
        <button id="yesBtn" onclick="decision('si')">Sí🫂</button>
        <button id="noBtn" onclick="decision('no')">No 🍃</button>
    `;

    iniciarEstrellitas(); // inicia lluvia de estrellitas solo en pantalla 2
}

function decision(valor){
    eliminarEstrellitas(); // eliminamos estrellitas de pantalla 2
    localStorage.setItem("decisionFinal",valor);
    document.getElementById("mainContainer").innerHTML="";

    if(valor==="si"){
        cambiarImagenes(imagenesSi);
        document.getElementById("mainContainer").innerHTML=`
        <h1>
        Gracias por seguir eligiéndome ❤️<br><br>
        No quiero perderte.<br>
        Voy a demostrarlo con hechos.
        </h1>
        `;
    }else{
        cambiarImagenes(imagenesNo, true);
        iniciarLluvia(); // lluvia azul solo en "no"
        iniciarCuentaRegresiva();
        document.getElementById("mainContainer").innerHTML=`
        <h1>
        Entiendo tu decisión.<br><br>
        Gracias por lo vivido.
        </h1>
        <div id="countdown" style="margin-top:20px;font-size:20px;"></div>
        `;
    }
}

// ================= LLUVIA =================

function iniciarLluvia(){
    for(let i=0;i<80;i++){
        const drop=document.createElement("div");
        drop.classList.add("rain");
        drop.style.left=Math.random()*window.innerWidth+"px";
        drop.style.animationDuration=(0.5+Math.random())+"s";
        document.body.appendChild(drop);
    }
}

// ================= ESTRELLITAS =================

function iniciarEstrellitas(){
    for(let i=0;i<50;i++){
        const star = document.createElement("div");
        star.classList.add("star"); // clase para poder eliminar
        star.textContent = "✨";
        star.style.left = Math.random()*window.innerWidth+"px";
        star.style.top = "-50px";
        star.style.fontSize = (10+Math.random()*15)+"px";
        star.style.opacity = 0.8;
        star.style.animation = "caerEstrella "+(2+Math.random()*3)+"s linear infinite";
        document.body.appendChild(star);
    }
}

// ================= CUENTA REGRESIVA =================

function iniciarCuentaRegresiva(){
    let tiempo=15;
    const interval=setInterval(()=>{
        document.getElementById("countdown").textContent=
        "Este enlace desaparecerá en "+tiempo+" segundos...";
        tiempo--;
        if(tiempo<0){
            clearInterval(interval);
            document.body.innerHTML=
            "<h1 style='color:white;text-align:center;margin-top:40vh;'>El capítulo terminó.</h1>";
        }
    },1000);
}

// ================= INICIO =================

pantallaInstructivo();

</script>

</body>
</html>
