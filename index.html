<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Quieres ser mi San Valentín?</title>

<style>
.background-slider {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: -2;
}

.background-slider img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    animation: fade 20s infinite;
}

.background-slider img:nth-child(1) { animation-delay: 0s; }
.background-slider img:nth-child(2) { animation-delay: 5s; }
.background-slider img:nth-child(3) { animation-delay: 10s; }
.background-slider img:nth-child(4) { animation-delay: 15s; }

@keyframes fade {
    0% { opacity: 0; }
    5% { opacity: 1; }
    25% { opacity: 1; }
    30% { opacity: 0; }
    100% { opacity: 0; }
}

.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: -1;
}

body {
    margin: 0;
    padding: 0;
   
    font-family: Arial, sans-serif;
    overflow: hidden;
    text-align: center;
    color: white;
}

.container {
    position: relative;
    top: 30vh;
    animation: fadeIn 2s ease-in-out;
}

h1 { font-size: 2.8em; }
h2 { font-weight: 300; }

button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 15px;
    transition: 0.3s;
}

.yes {
    background: #ff2e63;
    color: white;
}

.yes:hover {
    transform: scale(1.1);
}

.no {
    background: #333;
    color: white;
    position: absolute;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(-20px);}
    to {opacity: 1; transform: translateY(0);}
}

.heart {
    position: absolute;
    animation: float 6s linear infinite;
}

@keyframes float {
    from {transform: translateY(100vh);}
    to {transform: translateY(-10vh);}
}
</style>
</head>

<body>
<div class="background-slider">
    <img src="foto3.jpj">
    <img src="foto2.jpj">
    <img src="foto1.jpj">
</div>

<div class="overlay"></div>  
<div class="container">
   
    <h1>Yessica la mas enojona 💖</h1>
    <h2>¿Quieres ser mi San Valentín, este y todo los de las demas vidas, mi chiquis? 🌹</h2>
    <button class="yes" onclick="acepto()">Sí, acepto 💘</button>
    <button class="no" onmouseover="moverBoton(this)">No 😜</button>
</div>

<script>
function acepto() {
    document.body.innerHTML = `
    <div style="margin-top:30vh;">
        <h1>Sabía que dirías que sí 😍</h1>
        <h2>Te amo muchísimo 💕</h2>
        <h2>Prometo hacerte muy feliz 💜</h2>
    </div>
    `;
}

function moverBoton(btn) {
    btn.style.top = Math.random() * window.innerHeight + "px";
    btn.style.left = Math.random() * window.innerWidth + "px";
}

setInterval(() => {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 20) + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}, 500);
</script>

</body>
</html>
