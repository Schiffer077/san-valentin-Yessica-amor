<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Quieres ser mi San Valentín?</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Arial', sans-serif;
}

html, body{
    height:100%;
    overflow:hidden;
    background: #ffe6e6; /* rosa clarito */
}

/* ===== SLIDER DE FONDO ===== */
.background-slider{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    z-index:0; /* encima del body, debajo del overlay */
}

.background-slider img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit: cover; /* llena toda la pantalla */
    opacity:0;
    transition:opacity 1.5s ease-in-out;
    z-index:0; /* asegurar que las imágenes estén visibles */
}

.background-slider img.active{
    opacity:1;
}

/* ===== OVERLAY ROMÁNTICO ===== */
.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background: linear-gradient(
        rgba(255,182,193,0.3),
        rgba(255,192,203,0.2),
        rgba(255,182,193,0.3)
    );
    z-index:1; /* encima del slider pero debajo del contenido */
}

/* ===== CONTENIDO ABAJO ===== */
.container{
    position:absolute; /* relativo al body */
    bottom:50px;       /* distancia desde la parte inferior */
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center; /* centrado horizontal */
    text-align:center;
    color:#ff1e4d; /* texto rojo romántico */
    z-index:2; /* encima de todo */
    padding:0 20px; /* margen horizontal */
}

h1{
     font-size:1.8rem;           /* más pequeño que antes */
    font-weight:600;             /* un poco más grueso que normal */
    color:#ff4d6d;               /* rosita/rojo suave */
    margin-bottom:20px;          /* espacio entre texto y botones */
    animation:fadeIn 2s ease-in-out;
    line-height:1.3;             /* un poco más compacto */
}

.buttons{
    display:flex;
    gap:15px; /* espacio entre botones */
}

button{
    padding:12px 25px;
    border:none;
    border-radius:25px;
    font-size:1.1rem;
    cursor:pointer;
    transition:0.3s;
    font-weight:bold;
}

#yesBtn{
    background:#ff4d6d;
    color:white;
}

#yesBtn:hover{
    background:#ff1e4d;
    transform:scale(1.1);
}

#noBtn{
    background:white;
    color:#ff4d6d;
}

#noBtn:hover{
    position:absolute;
}

/* Animación */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(-20px);}
    to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<!-- SLIDER -->
<div class="background-slider">
    <img src="foto1.jpg" class="active">
    <img src="foto2.jpg">
    <img src="foto3.jpg">
    <img src="foto4.jpg">
    <img src="foto6.jpg">
    <img src="foto7.jpg">
</div>

<div class="overlay"></div>

<div class="container">
    <h1>💖 Yessica... ¿Quieres ser mi San Valentín? 💖</h1>

    <div class="buttons">
        <button id="yesBtn" onclick="alert('¡Sabía que dirías que sí ❤️!')">Sí 💘</button>
        <button id="noBtn">No 😢</button>
    </div>
</div>

<!-- Música -->
<audio autoplay loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>
/* ===== SLIDER AUTOMÁTICO ===== */
let slides = document.querySelectorAll(".background-slider img");
let index = 0;

setInterval(()=>{
    slides[index].classList.remove("active");
    index = (index + 1) % slides.length;
    slides[index].classList.add("active");
}, 4000);

/* ===== BOTÓN QUE HUYE ===== */
const noBtn = document.getElementById("noBtn");
noBtn.addEventListener("mouseover",()=>{
    noBtn.style.top=Math.random()*80+"%";
    noBtn.style.left=Math.random()*80+"%";
});
</script>

</body>
</html>
