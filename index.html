<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Quieres ser mi San Valentín?</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Arial', sans-serif;
}

html, body{
    height:100%;
    overflow:hidden;
    background: #ffe6e6; /* rosa clarito */
}

/* ===== SLIDER DE FONDO ===== */
.background-slider{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    z-index:0; /* encima del body, debajo del overlay */
}

.background-slider img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit: cover; /* llena toda la pantalla */
    opacity:0;
    transition:opacity 1.5s ease-in-out;
    z-index:0; /* asegurar que las imágenes estén visibles */
}

.background-slider img.active{
    opacity:1;
}

/* ===== OVERLAY ROMÁNTICO ===== */
.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background: linear-gradient(
        rgba(255,182,193,0.3),
        rgba(255,192,203,0.2),
        rgba(255,182,193,0.3)
    );
    z-index:1; /* encima del slider pero debajo del contenido */
}

/* ===== CONTENIDO ABAJO ===== */
.container{
    position:absolute; /* relativo al body */
    bottom:50px;       /* distancia desde la parte inferior */
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center; /* centrado horizontal */
    text-align:center;
    color:#ff1e4d; /* texto rojo romántico */
    z-index:3; /* encima de todo */
/* ===== CORAZONES FLOTANDO ===== */
#hearts{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none; /* no interfiere con botones */
    overflow:hidden;
    z-index:2; /* debajo del texto y botones */
}

.heart{
    position:absolute;
    width:20px;
    height:20px;
    background-color:#ff4d6d;
    transform:rotate(45deg);
    animation:floatUp 5s linear forwards;
}

.heart::before,
.heart::after{
    content:'';
    position:absolute;
    width:20px;
    height:20px;
    background-color:#ff4d6d;
    border-radius:50%;
}

.heart::before{
    top:-10px;
    left:0;
}

.heart::after{
    top:0;
    left:-10px;
}

/* Animación corazones */
@keyframes floatUp{
    0%{
        transform:translateY(0) rotate(45deg);
        opacity:1;
    }
    100%{
        transform:translateY(-600px) rotate(45deg);
        opacity:0;
    }
}

/* Animación texto */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(-20px);}
    to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<!-- SLIDER -->
<div class="background-slider">
    <img src="foto1.jpg" class="active">
    <img src="foto2.jpg">
    <img src="foto3.jpg">
    <img src="foto4.jpg">
    <img src="foto6.jpg">
    <img src="foto7.jpg">
</div>

<div class="overlay"></div>

<!-- CORAZONES -->
<div id="hearts"></div>

<div class="container">
    <h1>💖 Yessica...
        ¿Quieres ser mi San Valentín? 💖</h1>

    <div class="buttons">
        <button id="yesBtn" onclick="alert('¡Sabía que dirías que sí ❤️!')">Sí 💘</button>
        <button id="noBtn">No 😢</button>
    </div>
</div>

<!-- Música -->
<audio autoplay loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>
/* ===== SLIDER AUTOMÁTICO ===== */
let slides = document.querySelectorAll(".background-slider img");
let index = 0;

setInterval(()=>{
    slides[index].classList.remove("active");
    index = (index + 1) % slides.length;
    slides[index].classList.add("active");
}, 4000);

/* ===== BOTÓN QUE HUYE ===== */
const noBtn = document.getElementById("noBtn");
noBtn.addEventListener("mouseover",()=>{
    noBtn.style.top=Math.random()*80+"%";
    noBtn.style.left=Math.random()*80+"%";
});

/* ===== CORAZONES FLOTANDO ===== */
setInterval(()=>{
    const heart = document.createElement('div');
    heart.classList.add('heart');
    
    // posición horizontal aleatoria
    heart.style.left = Math.random() * 100 + "vw";
    
    // tamaño aleatorio
    const size = 10 + Math.random() * 20;
    heart.style.width = size + "px";
    heart.style.height = size + "px";
    
    heart.style.animationDuration = (4 + Math.random() * 3) + "s";
    
    document.getElementById('hearts').appendChild(heart);
    
    // eliminar corazón después de animación
    setTimeout(()=>{
        heart.remove();
    }, 7000);
}, 500); // cada 0.5s aparece un nuevo corazón
</script>

</body>
</html>
