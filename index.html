<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti Yessica</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Arial', sans-serif;
}

html, body{
    height:100%;
    overflow:hidden;
    background:#000;
}

/* SLIDER */
.background-slider{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    z-index:0;
}

.background-slider img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transition:opacity 1.5s ease-in-out, filter 1s ease;
}

.background-slider img.active{
    opacity:1;
}

.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.3);
    z-index:1;
}

.container{
    position:absolute;
    bottom:30px; 
    width:100%;
    text-align:center;
    z-index:3;
    padding:20px;
}

h1{
    color:white;
    margin-bottom:20px;
    font-size:1.1rem; /* letra predeterminada para pantalla Sí */
}

button{
    padding:12px 25px;
    border:none;
    border-radius:25px;
    font-size:1rem;
    cursor:pointer;
    font-weight:bold;
    margin:5px;
}

#yesBtn{
    background:#ff4d6d;
    color:white;
}

#noBtn{
    background:white;
    color:#ff4d6d;
}

/* LLUVIA */
.rain{
    position:fixed;
    width:2px;
    height:20px;
    background:rgba(0,150,255,0.7);
    animation:rainFall 1s linear infinite;
    z-index:2;
}

/* ESTRELLAS y CORAZONES */
.star{
    position:fixed;
    color:white;
    opacity:0.8;
    z-index:2;
    pointer-events:none;
    font-size:12px;
    animation:caerEstrella 3s linear infinite;
}

.corazon{
    position:fixed;
    font-size:20px;
    z-index:4;
    pointer-events:none;
    animation:subirCorazon linear forwards;
}

.mensaje{
    position:fixed;
    color:pink;
    font-weight:bold;
    z-index:4;
    pointer-events:none;
    animation:subirMensaje linear forwards;
}

/* Pantalla No - contador más pequeño y blanco */
#countdown{
    font-size:14px;
    color:white;
}

@keyframes rainFall{
    0%{transform:translateY(-100px);}
    100%{transform:translateY(100vh);}
}

@keyframes caerEstrella{
    0%{transform:translateY(-50px);}
    100%{transform:translateY(100vh);}
}

@keyframes subirCorazon{
    0%{transform:translateY(100vh);}
    100%{transform:translateY(-50px);}
}

@keyframes subirMensaje{
    0%{transform:translateY(100vh);}
    100%{transform:translateY(-50px);}
}

</style>
</head>

<body>

<div class="background-slider" id="slider"></div>
<div class="overlay"></div>
<div class="container" id="mainContainer"></div>

<audio autoplay loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>

// ================= IMÁGENES =================
const imagenesInicio = ["foto102.jpg"];
const imagenesPregunta = [
    "foto202.jpg","foto7.jpg","foto2.jpg","foto6.jpg","foto2010.jpg",
    "foto208.jpg","foto204.jpg","foto201.jpg","foto1.jpg"
];
const imagenesSi = [
    "foto203.jpg","foto301.jpg","foto4.jpg","foto303.jpg","foto306.jpg",
    "foto305.jpg","foto9.jpg","foto402.jpg","foto403.jpg","foto405.jpg",
    "foto406.jpg","foto407.jpg","foto411.jpg","foto412.jpg","foto416.jpg",
    "foto417.jpg","triste7.jpg"
];
const imagenesNo = [
    "triste7.jpg","foto9.jpg","foto305.jpg","foto306.jpg","foto303.jpg",
    "foto4.jpg","foto301.jpg","foto203.jpg","foto402.jpg","foto403.jpg",
    "foto405.jpg","foto406.jpg","foto407.jpg","foto411.jpg","foto412.jpg",
    "foto416.jpg","foto417.jpg","triste7.jpg"
];

let slides = [];
let index = 0;
let sliderInterval;
let palabraInterval;
let imagenFinalMostrada = false;

// ================= FUNCIONES =================
function cambiarImagenes(lista, blancoNegro=false, rosita=false, callback=null){
    clearInterval(sliderInterval);
    const slider = document.getElementById("slider");
    slider.innerHTML = "";

    lista.forEach((img,i)=>{
        const imagen = document.createElement("img");
        imagen.src = img;

        if(blancoNegro) imagen.style.filter="grayscale(100%) brightness(70%)";
        else if(rosita) imagen.style.filter="brightness(90%) sepia(15%) saturate(150%) hue-rotate(-10deg)";
        else imagen.style.filter="none";

        if(i===0) imagen.classList.add("active");
        slider.appendChild(imagen);
    });

    slides = document.querySelectorAll(".background-slider img");
    index = 0;

    sliderInterval = setInterval(()=>{
        slides[index].classList.remove("active");
        index++;
        if(index >= slides.length){
            clearInterval(sliderInterval);
            if(callback) callback();
            return;
        }
        slides[index].classList.add("active");
    }, 4000);
}

function eliminarEstrellitas(){
    document.querySelectorAll(".star,.corazon,.mensaje").forEach(e=>e.remove());
}

// ================= FLUJO =================
function pantallaInstructivo(){
    const slider = document.getElementById("slider");
    slider.innerHTML = `<img src="foto102.jpg" class="active" style="width:100%;height:100%;object-fit:cover;">`; // Imagen fija
    document.getElementById("mainContainer").innerHTML=`
        <h1></h1>
        <button style="background:#ffb6c1; color:white;" onclick="pantallaPregunta()">
            Aceptar y continuar ❤️
        </button>
    `;
}

function pantallaPregunta(){
    cambiarImagenes(imagenesPregunta, false, true);
    document.getElementById("mainContainer").innerHTML=`
        <h1><br>¿Quieres seguir escribiendo esta historia conmigo?</h1>
        <button id="yesBtn" onclick="decision('si')">Sí🫂</button>
        <button id="noBtn" onclick="decision('no')">No 🍃</button>
    `;
    iniciarEstrellitas();
}

function decision(valor){
    eliminarEstrellitas();
    localStorage.setItem("decisionFinal", valor);
    document.getElementById("mainContainer").innerHTML="";

    if(valor==="si"){
        iniciarPantallaSi();
    }else{
        cambiarImagenes(imagenesNo, true);
        iniciarLluvia();
        iniciarCuentaRegresiva();
        document.getElementById("mainContainer").innerHTML=`
        <h1 style="font-size:0.9rem;color:white;">Entiendo tu decisión y dislpa por todo lo bueno y malo que vivimos.<br><br>Te llevare muy dentro de mi corazón mi amor.</h1>
        <div id="countdown"></div>
        `;
    }
}

// ================= PANTALLA “SÍ” =================
function iniciarPantallaSi(){
    const palabras = [
        "Tienes que ver todas las fotos","Te quiero","Gracias por seguir eligiéndome",
        "Vamos hacer un bebé","Cacémonos","Te haré feliz",
        "Vive conmigo","Eres perfecta","Mi niña hermosa","te amo","Perdoname por ser groosero","Te amare para toda mi vidda",
        "Tu y yo vs el mundo","Te are muy feliz","100% eres tu","Muero por ti","Perdon por todo","Cambiare hoy y siempre"
    ];

    cambiarImagenes(imagenesSi, false, false, mostrarPantallaFinal);

    // Iniciar corazones flotantes
    setInterval(()=>{
        const c = document.createElement("div");
        c.classList.add("corazon");
        c.textContent = "💖";
        c.style.left = Math.random()*window.innerWidth+"px";
        c.style.fontSize = (15+Math.random()*15)+"px";
        c.style.animationDuration = (3+Math.random()*3)+"s";
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),5000);
    },500);

    // Iniciar palabras flotantes
    palabraInterval = setInterval(()=>{
        const m = document.createElement("div");
        m.classList.add("mensaje");
        m.textContent = palabras[Math.floor(Math.random()*palabras.length)];
        m.style.left = Math.random()*window.innerWidth+"px";
        m.style.fontSize = (12+Math.random()*10)+"px";
        m.style.animationDuration = (4+Math.random()*3)+"s";
        document.body.appendChild(m);
        setTimeout(()=>m.remove(),5000);
    },700);
}

// ================= PANTALLA FINAL =================
function mostrarPantallaFinal(){
    clearInterval(palabraInterval);

    const slider = document.getElementById("slider");
    slider.innerHTML = `<img src="foto_final.jpg" class="active" style="width:100%;height:100%;object-fit:cover;">`;

    document.getElementById("mainContainer").innerHTML=`
        <h1 style="font-size:1.5rem;margin-top:40vh;color:white;">Escríbeme en WhatsApp<br>MQC</h1>
    `;
}

// ================= LLUVIA =================
function iniciarLluvia(){
    for(let i=0;i<80;i++){
        const drop=document.createElement("div");
        drop.classList.add("rain");
        drop.style.left=Math.random()*window.innerWidth+"px";
        drop.style.animationDuration=(0.5+Math.random())+"s";
        document.body.appendChild(drop);
    }
}

// ================= ESTRELLITAS =================
function iniciarEstrellitas(){
    for(let i=0;i<50;i++){
        const star = document.createElement("div");
        star.classList.add("star");
        star.textContent = "✨";
        star.style.left = Math.random()*window.innerWidth+"px";
        star.style.top = "-50px";
        star.style.fontSize = (10+Math.random()*15)+"px";
        star.style.opacity = 0.8;
        star.style.animation = "caerEstrella "+(2+Math.random()*3)+"s linear infinite";
        document.body.appendChild(star);
    }
}

// ================= CUENTA REGRESIVA =================
function iniciarCuentaRegresiva(){
    let tiempo=30;
    const interval=setInterval(()=>{
        document.getElementById("countdown").textContent=
        "Este enlace desaparecerá en "+tiempo+" segundos...";
        tiempo--;
        if(tiempo<0){
            clearInterval(interval);
            document.body.innerHTML=
            "<h1 style='color:white;text-align:center;margin-top:40vh;'>El capítulo terminó.</h1>";
        }
    },1000);
}

// ================= INICIO =================
pantallaInstructivo();

</script>

</body>
</html>
